
[env:coretastic-meshtastic]
extends = env:heltec-v4
board_build.partitions = coretastic/partitions.csv
board_build.app_partition_name = meshtastic
board_upload.offset_address = 0x400000
extra_scripts =
    ${env.extra_scripts}
    post:coretastic/build.py
build_flags =
    ${env:heltec-v4.build_flags}
    -D CORETASTIC_MESHCORE=0

    --specs=nano.specs
    -u _printf_float

; All resolved libraries, including transitive registry dependencies.
