
[env:coretastic-meshcore]
extends = env:heltec_v4_companion_radio_ble
board_build.partitions = coretastic/partitions.csv
board_build.app_partition_name = meshcore
board_upload.offset_address = 0x100000
extra_scripts = post:coretastic/build.py
build_flags =
    ${env:heltec_v4_companion_radio_ble.build_flags}
    -D CORETASTIC_MESHCORE=1
    -D DISABLE_WIFI_OTA=1

; All resolved libraries, including transitive registry dependencies.
lib_deps =
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit BME680 Library@2.0.6
    adafruit/Adafruit BMP085 Library@1.2.4
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit INA260 Library@1.5.3
    adafruit/Adafruit INA3221 Library@1.0.1
    adafruit/Adafruit MLX90614 Library@2.1.6
    adafruit/Adafruit NeoPixel@1.15.5
    adafruit/Adafruit SH110X@2.1.15
    adafruit/Adafruit SHTC3 Library@1.0.2
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit_VL53L0X@1.2.5
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/Arduino_LPS22HB@1.0.3
    electroniccats/CayenneLPP@1.6.1
    rweather/Crypto@0.4.0
    robtillaart/INA226@0.6.6
    melopero/Melopero RV3028@1.2.0
    stevemarple/MicroNMEA@2.0.6
    adafruit/RTClib@2.1.4
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SHT4x@1.1.2
    densaugeo/base64@1.4.0
    https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6

platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-scons@4.40801.0
    platformio/tool-esptoolpy@1.40501.0
