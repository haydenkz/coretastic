version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    # Upstream source changes must also update the lock and pass integration builds.
    open-pull-requests-limit: 2
