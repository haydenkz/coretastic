name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.16'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'meshcore/integration.ini', 'meshtastic/integration.ini', 'requirements.txt') }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
      - name: Formatting and lint
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          clang-format --dry-run --Werror src/*.cpp include/*.h scripts/firmware/integration.cpp tests/*.cpp tests/idf_stubs/*.h
          npm run format:check --prefix web
          npm run lint --prefix web
      - name: Host and browser contract tests
        run: |
          python scripts/device/test.py
          npm test --prefix web
      - name: Build selector
        run: python scripts/firmware/build.py selector
      - name: Build integrated MeshCore BLE Companion
        run: python scripts/firmware/build.py meshcore
      - name: Build integrated Meshtastic
        run: python scripts/firmware/build.py meshtastic
      - name: Package and validate all firmware
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/release/package.py --version "$RELEASE_VERSION"
          python scripts/release/validate_release.py release/manifest.json
          npm run test:release --prefix web
          python scripts/release/source_bundle.py
      - name: Build matching web flasher
        run: |
          mkdir -p web/public/releases
          cp release/*.bin release/manifest.json release/SHA256SUMS web/public/releases/
          npm run build --prefix web -- --base /coretastic/
      - name: Retain firmware, source, and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Retain web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-diagnostics-${{ github.sha }}
          path: |
            .pio/build/selector/*.map
            .pio/build/selector/CMakeFiles/CMakeError.log
            .build/*/.pio/build/*/*.map
          if-no-files-found: warn
      - name: Stage Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: firmware-${{ github.sha }}
        run: gh run download "$RUN_ID" --name "$ARTIFACT" --dir release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf coretastic-bundle.tar.gz -C release .
          gh release create "$TAG" --verify-tag --title "Coretastic $TAG" --generate-notes coretastic-bundle.tar.gz release/*.bin release/manifest.json release/SHA256SUMS release/toolchains.json release/corresponding-source.tar.gz
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy matching flasher and release assets
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
